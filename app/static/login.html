<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · IPTV Proxy</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/login.js"></script>
</head>
<body class="login-page">
  <div class="login-card">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 2.5l4 3.5 4-3.5"/><path d="M10.5 10.5v4l3.5-2z" fill="currentColor"/></svg></span>
    <h1>IPTV Proxy</h1>
    <p>Enter the password to open the manager.</p>
    <form id="login-form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" autofocus required>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button id="login-submit" class="primary" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
