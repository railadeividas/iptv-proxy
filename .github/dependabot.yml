---
version: 2
updates:
  # Go modules (go.mod / go.sum)
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(go)" }
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # Vue admin UI (web/package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(web)" }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile (node and golang build stages, node runtime)
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(docker)" }

  # Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(ci)" }
    groups:
      actions:
        patterns: ["*"]
