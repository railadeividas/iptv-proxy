name: Publish image
# Every push to main is tested and published as its own image, tagged with the short commit hash (for example
# ghcr.io/<owner>/<repo>:ef711d2); `latest` follows the newest of them. There are no git tags and no GitHub Releases; the commit hash is the version.
# A manual run can add more image tags (input `tags`); the hash tag is always there, and `latest` only moves for runs from main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly rebuild of main picks up iptv-org/epg updates
  workflow_dispatch:
    inputs:
      tags:
        description: "Extra image tags, separated by commas or spaces (optional). The short commit hash is always added; `latest` too when run from main."
        required: false
        default: ""
        type: string
permissions:
  contents: read
  packages: write
# Builds never cancel each other: two merges at nearly the same time both get their own image. Only `latest` is shared,
# and it is moved by the `latest` job below, one at a time and only forward.
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # QEMU only runs the arm64 part of the Dockerfile's last stage; the UI and the Go binary are cross-compiled natively.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the version shown in the app: the short commit hash
      - id: ver
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Tags typed into the manual run (empty on every other event), one `type=raw` line each. `latest` is never set here: only the
      # `latest` job below moves it, so a manual tag run can't bypass its checks.
      - id: extra
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          {
            echo "tags<<EOF"
            for t in $(printf '%s' "$INPUT_TAGS" | tr ',' ' '); do
              [[ "$t" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::Invalid tag: $t" >&2; exit 1; }
              echo "type=raw,value=$t"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=,format=short
            ${{ steps.extra.outputs.tags }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          # no provenance / SBOM attestations: they only add untagged `unknown/unknown` rows next to the platform images
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # `latest` follows the newest commit that has an image. Jobs of this group run one at a time, and a job skips itself when a newer
  # commit on main already has its image, so a slow older build can never move `latest` back.
  latest:
    needs: image
    # push and schedule always run on main; a manual run only counts when started from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: move-latest
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at this commit unless a newer one is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main?per_page=100" --jq '.commits[].sha'); do
            if docker buildx imagetools inspect "$repo:${sha::7}" >/dev/null 2>&1; then
              echo "A newer commit (${sha::7}) already has its image; leaving latest to it."
              exit 0
            fi
          done
          docker buildx imagetools create -t "$repo:latest" "$repo:${GITHUB_SHA::7}"
