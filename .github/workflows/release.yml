name: Release image
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1" # weekly rebuild picks up iptv-org/epg updates
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the version shown in the app: the tag for a release (v1.2.0), otherwise edge-<commit>
      - id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="edge-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # the metadata action also adds `latest` on tags by default; the raw tag below does it for every run, so turn the default off
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=v{{version}}
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # a GitHub Release for every version tag, once the tests passed and the image is published
  release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release (skipped when one exists)
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
