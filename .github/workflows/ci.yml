name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # the release workflow runs the tests first
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: CGO_ENABLED=0 go build ./cmd/server

  # builds the real image and runs the iptv-org/epg grabber in it against a local fixture (no internet):
  # catches a Node version the grabber cannot run on, a renamed grabber option, or a broken Dockerfile
  epg-grabber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t iptv-smoke .
      - run: docker run --rm -v "$PWD/scripts/epg-smoke.sh:/smoke.sh:ro" --entrypoint sh iptv-smoke /smoke.sh
